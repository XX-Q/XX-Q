<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">XQ — PhD Student at Peking University</title>
  <desc id="desc">A dark academic-style banner with abstract graph nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#3b1222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c1d40"/>
      <stop offset="1" stop-color="#ef6f91"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#cb1b45" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#cb1b45" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#fff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="88" r="260" fill="url(#glow)"/>

  <g opacity="0.34" stroke="#f4b8c7" stroke-width="1.5">
    <path d="M815 94 L930 48 L1042 112 L1138 60"/>
    <path d="M815 94 L890 184 L1042 112 L1102 228"/>
    <path d="M890 184 L982 286 L1102 228 L1170 310"/>
    <path d="M930 48 L982 286" stroke-dasharray="5 8"/>
    <path d="M1042 112 L1170 310" stroke-dasharray="5 8"/>
  </g>

  <g fill="#f7d6de" filter="url(#shadow)">
    <circle cx="815" cy="94" r="6"/>
    <circle cx="930" cy="48" r="8"/>
    <circle cx="1042" cy="112" r="10"/>
    <circle cx="1138" cy="60" r="5"/>
    <circle cx="890" cy="184" r="9"/>
    <circle cx="982" cy="286" r="7"/>
    <circle cx="1102" cy="228" r="11"/>
    <circle cx="1170" cy="310" r="6"/>
  </g>

  <rect x="70" y="66" width="72" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="70" y="160" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="750" letter-spacing="-2">XQ</text>
  <text x="70" y="211" fill="#f4b8c7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600" letter-spacing="1.2">PHD STUDENT · PEKING UNIVERSITY</text>
  <text x="70" y="266" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400">Federated Learning  /  Graph Representation  /  Trustworthy AI</text>
  <text x="70" y="315" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Build carefully. Learn continuously. Share openly.</text>
</svg>
